services:
  api:
    build: .
    image: deepcloud:latest
    ports:
      - "8000:8000"
    environment:
      DEEPCLOUD_LOG_LEVEL: info
      DEEPCLOUD_MAX_BATCH: "64"
      DEEPCLOUD_CONFIDENCE_THRESHOLD: "0.5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
